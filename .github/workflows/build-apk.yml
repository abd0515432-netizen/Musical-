
name: Build Musical APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Musical project
        run: unzip Musical_Glassmorphism_Android_Project.zip -d musical-src

      - name: Build APK
        run: gradle -p musical-src assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Musical-APK
          path: musical-src/app/build/outputs/apk/debug/app-debug.apk
          
